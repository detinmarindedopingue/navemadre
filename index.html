<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda ModullApp</title>
    <!-- Aquí llamaremos a nuestro CSS más adelante -->
</head>
<body>

    <!-- Encabezado de la tienda -->
    <header>
        <h1 id="store-name">Cargando tienda...</h1>
    </header>

    <!-- Aquí se mostrarán los productos dinámicamente -->
    <main>
        <!-- El motor app.js inyectará las tarjetas aquí dentro -->
        <div id="product-container"></div>
    </main>

    <!-- Botón flotante de WhatsApp (por ahora un texto, luego le damos estilo) -->
    <a id="whatsapp-btn" href="#" target="_blank">Hacer pedido por WhatsApp</a>

    <!-- ÚNICA etiqueta de script. El motor se encarga de traer a config.js y firebase.js -->
    <script type="module" src="./js/app.js"></script>

</body>
</html>
